<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#f7f8fc">
    <link rel="icon" type="image/jpeg" href="assets/images/profile-placeholder.jpg">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="./">{{ page.author_name | default: site.title }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#about">About</a>
        <a href="#news">News</a>
        <a href="#publications">Publications</a>
        <a href="#teaching">Teaching &amp; service</a>
        <a href="#more">More</a>
      </nav>
    </header>

    <main class="page">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>&copy; {{ 'now' | date: '%Y' }} {{ page.author_name | default: site.title }}. Built with Markdown and GitHub Pages.</p>
    </footer>
  </body>
</html>
